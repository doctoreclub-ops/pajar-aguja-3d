<style>

body.touch #rm{top:calc(50% + 40px);font-size:19px;padding:7px 18px 7px 7px}body.touch #rm .ring{width:38px;height:38px}body.touch #rm .ring::after{inset:5px;font-size:16px}

#bottom{position:absolute;left:50%;bottom:max(6px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px}

.slot .ic{font-size:18px;margin-top:6px}
.slot .tx{font:700 9px "Barlow Condensed";color:#ddd;margin-top:8px;letter-spacing:.04em}
#prompts{display:flex;gap:14px;font:600 11px "Barlow";color:#e8e6dc;text-shadow:0 1px 2px #000;white-space:nowrap}

#det{position:absolute;left:50%;top:64%;transform:translateX(-50%);font:700 13px "Barlow Condensed";color:#8fe36a;text-shadow:0 1px 2px #000;display:none}

#touch{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
body.touch #touch{display:block}
#joyz{position:absolute;left:0;bottom:0;width:45%;height:55%;pointer-events:auto}

/* panels */
.panel{position:fixed;inset:0;z-index:40;display:none;background:rgba(6,6,8,.9);color:#e8e6dc;pointer-events:auto}

#tree{flex-direction:column}

.cat{align-items:center;justify-content:center;background:rgba(0,0,0,.35)!important}

  g_intro: "You have a shovel and a haystack with about thirteen million strands in it. Somewhere inside there's a needle. Dig it out by hand, sell the hay on the belt, then spend the money on belts and machines until you don't have to dig anymore.",
  g_ctl_desk: 'WASD move · Mouse look · LMB dig · RMB tip · E use · F throw · Q put tool down · Tab tech tree · B build · Shift run · Esc menu',
  g_ctl_touch: 'Left stick move · drag the right side to look · LMB dig · RMB tip · E use · TAB tree · ☰ menu',
  g_howmuch: 'HOW MUCH HAY', g_small: 'SMALL', g_small_d: 'Designed for weaker computers. A shorter hunt with room to walk around the pile · 5 m tall, about 4.6 million strands.',
  g_standard: 'STANDARD', g_standard_d: 'The yard as it comes. The pile the game was built around, under one steel roof · 7 m tall, about 13.8 million strands.',
  g_bigger: 'I WANT BIGGER', g_bigger_d: 'Bigger piles than this one. They ask a lot of a computer · 9 m tall, about 29 million strands.',
  g_newrun_warn: 'This starts over. Your money, tools and machines are wiped.', g_loading: 'SHAPING THE PILE', g_load_tip: 'Yard Boots makes you walk and run faster.',
  pause_title: 'PAUSED', resume: 'RESUME', sens: 'Look sensitivity', quality: 'Graphics', q_low: 'LOW', q_high: 'HIGH', to_title: 'QUIT TO TITLE',
  key_wheel: 'Wheel up',
  s1_t: 'Pick up some hay', s1_b: 'Look at the haystack. Hold <b>LMB</b> to pull out hay. Your hand takes only one straw at a time. A shovel takes much more.',
  s2_t: 'Carry it to the stand', s2_b: 'Follow the belt to the <b>HAY IN</b> sign in the far corner. The low end of the belt is the open bay.',
  s3_t: 'Sell hay at the stand', s3_b: 'The selling stand is in the far corner. Walk there. Stand at the open bay and press <b>LMB</b> to drop the hay in. You get money for it.',
  s4_t: 'Open the tech tree', s4_b: 'Press <b>Tab</b> to open the tech tree. Buy machines and upgrades here. Press <b>Tab</b> again to close it.',
  s5_t: 'Buy bigger hands', s5_b: 'In <b>HAND WORK</b>, buy Bigger Hands for $0.10. Your hand holds one more straw for every level.',
  s6_t: 'Buy the toy shovel', s6_b: 'Walk to the <b>SUPPLY CO.</b> counter and press <b>E</b>. Buy the Toy Shovel for $0.25. It goes in the next free box on your bar.',
  s7_t: 'Hold the shovel', s7_b: 'Press <b>2</b> or tap its box on your bar to take the shovel in your hands.',
  s8_t: 'Dig with the shovel', s8_b: 'Look at the haystack and press <b>LMB</b>. The blade fills with hay. Dig three times.',
  s9_t: 'Sell a full blade', s9_b: 'Carry the blade to the open bay and press <b>LMB</b> to tip it in. Watch it ride up the belt.',
  s10_t: 'Throw it', s10_b: 'With hay on the blade, press <b>F</b> to throw the whole load. Try to land it on the belt.',
  s11_t: 'Empty the blade', s11_b: 'Point where you want the hay. Press <b>RMB</b>. The whole load goes there. Do this three times.',
  s12_t: 'Earn thirty dollars', s12_b: 'Press <b>LMB</b> to dig. Carry the hay to the stand without <b>Shift</b>, or you will drop it. Press <b>RMB</b> to tip it in. Do this until you have thirty dollars. The spade costs $15 for the card and $12 for the spade itself.',
  s13_t: 'Buy the spade', s13_b: 'Press <b>Tab</b>. Buy the Spade card for $15. Then buy the spade in the shop for $12. Press <b>E</b> to pick it up. It goes in the next free box on your bar.',
  s14_t: 'Put a tool down', s14_b: 'Take a tool in your hands. Press <b>Q</b> to put it on the ground, or <b>F</b> to throw it. It stays there. Walk to it and press <b>E</b> to pick it up again.',
  s15_t: 'Fetch a lost tool', s15_b: 'Press <b>Q</b> to put a tool on the ground. Walk to the shop counter and press <b>E</b>. Click <b>BRING TO ME</b> next to that tool. It comes back to your feet.',
  s16_t: 'Buy the conveyor plans', s16_b: 'Press <b>Tab</b>. In <b>HAY LINES</b> buy Conveyor Plans for $40. Belts carry hay for you.',
  s17_t: 'Build a conveyor belt', s17_b: "Press <b>B</b> and pick Conveyor Belt, $8 per metre. Click to start the run and click again to place it. End it on the stand's belt so they join.",
  s18_t: 'Tip hay on your belt', s18_b: 'Stand by your belt and press <b>RMB</b> to tip a load onto it. It rides to the stand and sells on its own.',
  s19_t: 'Reach a hundred dollars', s19_b: 'Keep selling hay until you have one hundred dollars. Then you can start building machines instead of carrying hay yourself.',
  s20_t: 'Speed up the belts', s20_b: 'Belts jam when you pile on too much. Press <b>Tab</b> and buy <b>Faster Belt Motor</b> for $15. Every belt runs faster.',
  s21_t: 'Build the needle cabinet', s21_b: 'Press <b>Tab</b>. Buy the Needle Cabinet card for $10. Press <b>B</b> and pick the cabinet. Click a place on the floor to build it.',
  s22_t: 'Turn it around', s22_b: 'Press <b>B</b> and pick anything. Press <b>R</b> to turn the copy before you place it. Press <b>RMB</b> to cancel.',
  s23_t: 'Move it closer or further', s23_b: 'Press <b>B</b> and pick anything. You now see a copy of it on your cursor. Roll the mouse wheel, or press <b>C</b> and <b>V</b>. The copy moves closer to you and further away.',
  s24_t: 'Open the cabinet', s24_b: 'Look at the needle cabinet and press <b>E</b>. Every kind of needle has its own drawer.',
  s25_t: 'Sell for more', s25_b: 'The sign by the bay says what a strand is worth. Press <b>Tab</b> and look at <b>SELLING</b>. Each level makes everything sell for 5% more.',
  s26_t: 'Take something down again', s26_b: 'Point at anything you built. Hold <b>X</b> until it comes down. You get all your money back.',
  s27_t: 'Build a piston rake', s27_b: 'Press <b>Tab</b>. Buy the Hay Piston Rake card for $60. Press <b>B</b> and place it in front of the haystack. It costs $120 to build. It must face the hay or it does nothing. It will not work until it has power.',
  s28_t: 'Give the rake power', s28_b: 'Your rake needs power. Press <b>Tab</b> and buy Electricity for $90. Press <b>B</b> and build a Hay Generator for $150 and a Power Pole for $45. The pole must stand within 6 metres of the rake and of the generator. Put hay into the generator so it has something to burn.',
  s29_t: 'Set how far the rake throws', s29_b: 'Your rake throws the hay over its back. You choose how far. Look at the rake and press <b>E</b> to open its panel. Drag the slider. The marks on the ground show where the hay will land.',
  s30_t: 'Feed a belt with the rake', s30_b: "Put a belt where the rake's hay lands. Now the rake loads the belt on its own and you can stop digging.",
  s31_t: 'Build a robotic arm', s31_b: 'Press <b>Tab</b>. Buy Small Arm Plans for $90. Press <b>B</b> and place the arm between the haystack and a belt, $180 to build, with a pole near it. It digs and puts the hay on the belt.',
  s32_t: 'Buy the metal detector', s32_b: 'Press <b>Tab</b> and buy the Metal Detector card for $130. Then buy the detector in the shop for $260. It beeps faster the closer you are to a needle. Walk over the pile and listen.',
  s33_t: 'Switch the detector on and off', s33_b: 'Hold the detector. Press <b>RMB</b> to turn it on and again to turn it off. Do this three times.',
  s34_t: 'Pin the delivery order', s34_b: 'The board by the bay door has an order on it. Look at the big sheet on the left and press <b>E</b>. It shows in the corner of your screen.',
  s35_t: 'Fill the first order', s35_b: 'The order wants two thousand strands through the stand. Keep the belts busy. The truck pays a bonus when it is full.',
  s36_t: 'Put a scanner on a belt', s36_b: 'Press <b>Tab</b> and buy Scanner MK1 Plans. Press <b>B</b> and build it over a belt. It checks the hay that passes for needles.',
  s37_t: 'Keep the fire going', s37_b: 'Look at the Hay Generator with hay in your hands and press <b>E</b> to feed it. No hay, no power. Do this twice.',
  s38_t: 'Buy yard boots', s38_b: 'Press <b>Tab</b>. In <b>FITNESS</b> buy Yard Boots. They make you walk and run faster.',
  s39_t: 'Stretch your legs', s39_b: 'Hold <b>Shift</b> to run with empty hands. The bar at the bottom left is your stamina. Run for three seconds.',
  s40_t: 'Find the needle', s40_b: 'Walk round the pile with the detector on. When the beeps turn into a scream, press <b>LMB</b> to dig. Or let the scanner catch one on the belt.',
  s41_t: 'Fill the cabinet', s41_b: 'There are more needles in the pile, and more kinds. Keep digging, keep the belts running, and fill every drawer.',

  g_bigger: 'LO QUIERO MÁS GRANDE', g_bigger_d: 'Pajares más grandes que este. Exigen mucho al ordenador · 9 m de alto, unos 29 millones de pajas.',
  g_newrun_warn: 'Esto empieza de cero. Se borran tu dinero, herramientas y máquinas.', g_loading: 'DANDO FORMA AL PAJAR', g_load_tip: 'Las Botas de patio te hacen andar y correr más rápido.',
  pause_title: 'PAUSA', resume: 'CONTINUAR', sens: 'Sensibilidad de la vista', quality: 'Gráficos', q_low: 'BAJOS', q_high: 'ALTOS', to_title: 'SALIR AL MENÚ',
  key_wheel: 'Rueda arriba',
  s1_t: 'Coge un poco de paja', s1_b: 'Mira el pajar. Mantén <b>clic izquierdo</b> para sacar paja. Tu mano solo coge una paja cada vez. Una pala coge muchas más.',
  s2_t: 'Llévala al puesto', s2_b: 'Sigue la cinta hasta el cartel <b>HAY IN</b> en la esquina del fondo. El extremo bajo de la cinta es la entrada abierta.',
  s3_t: 'Vende paja en el puesto', s3_b: 'El puesto de venta está en la esquina del fondo. Ve hasta allí. Ponte en la entrada abierta y pulsa <b>clic izquierdo</b> para echar la paja. Te pagan por ella.',
  s4_t: 'Abre el árbol tecnológico', s4_b: 'Pulsa <b>Tab</b> para abrir el árbol tecnológico. Aquí compras máquinas y mejoras. Pulsa <b>Tab</b> otra vez para cerrarlo.',
  s5_t: 'Compra manos más grandes', s5_b: 'En <b>TRABAJO MANUAL</b>, compra Manos más grandes por $0,10. Tu mano coge una paja más por cada nivel.',
  s6_t: 'Compra la pala de juguete', s6_b: 'Ve al mostrador de <b>SUPPLY CO.</b> y pulsa <b>E</b>. Compra la Pala de juguete por $0,25. Va a la siguiente casilla libre de tu barra.',
  s7_t: 'Coge la pala', s7_b: 'Pulsa <b>2</b> o toca su casilla en la barra para coger la pala.',
  s8_t: 'Cava con la pala', s8_b: 'Mira el pajar y pulsa <b>clic izquierdo</b>. La pala se llena de paja. Cava tres veces.',
  s9_t: 'Vende una pala llena', s9_b: 'Lleva la pala a la entrada abierta y pulsa <b>clic izquierdo</b> para echarla. Mira cómo sube por la cinta.',
  s10_t: 'Lánzala', s10_b: 'Con paja en la pala, pulsa <b>F</b> para lanzar toda la carga. Intenta que caiga en la cinta.',
  s11_t: 'Vacía la pala', s11_b: 'Apunta adonde quieras la paja. Pulsa <b>clic derecho</b>. Toda la carga va allí. Hazlo tres veces.',
  s12_t: 'Gana treinta dólares', s12_b: 'Pulsa <b>clic izquierdo</b> para cavar. Lleva la paja al puesto sin <b>Shift</b> o se te caerá. Pulsa <b>clic derecho</b> para echarla. Repite hasta tener treinta dólares. La pala cuesta $15 la carta y $12 la pala.',
  s13_t: 'Compra la pala', s13_b: 'Pulsa <b>Tab</b>. Compra la carta de la Pala por $15. Luego compra la pala en la tienda por $12. Pulsa <b>E</b> para cogerla. Va a la siguiente casilla libre de tu barra.',
  s14_t: 'Deja una herramienta', s14_b: 'Coge una herramienta. Pulsa <b>Q</b> para dejarla en el suelo o <b>F</b> para lanzarla. Se queda ahí. Ve hasta ella y pulsa <b>E</b> para cogerla otra vez.',
  s15_t: 'Recupera una herramienta perdida', s15_b: 'Pulsa <b>Q</b> para dejar una herramienta en el suelo. Ve al mostrador de la tienda y pulsa <b>E</b>. Pulsa <b>TRÁEMELA</b> junto a esa herramienta. Vuelve a tus pies.',
  s16_t: 'Compra los planos de cinta', s16_b: 'Pulsa <b>Tab</b>. En <b>LÍNEAS DE PAJA</b> compra los Planos de cinta por $40. Las cintas llevan la paja por ti.',
  s17_t: 'Construye una cinta transportadora', s17_b: 'Pulsa <b>B</b> y elige Cinta transportadora, $8 por metro. Haz clic para empezar el tramo y otra vez para colocarlo. Termínala sobre la cinta del puesto para que se unan.',
  s18_t: 'Echa paja en tu cinta', s18_b: 'Ponte junto a tu cinta y pulsa <b>clic derecho</b> para echar una carga. Viaja hasta el puesto y se vende sola.',
  s19_t: 'Llega a cien dólares', s19_b: 'Sigue vendiendo paja hasta tener cien dólares. Entonces podrás construir máquinas en vez de cargar la paja tú.',
  s20_t: 'Acelera las cintas', s20_b: 'Las cintas se atascan si echas demasiado. Pulsa <b>Tab</b> y compra el <b>Motor de cinta más rápido</b> por $15. Todas las cintas van más rápido.',
  s21_t: 'Construye el armario de agujas', s21_b: 'Pulsa <b>Tab</b>. Compra la carta del Armario de agujas por $10. Pulsa <b>B</b> y elige el armario. Haz clic en el suelo para construirlo.',
  s22_t: 'Gíralo', s22_b: 'Pulsa <b>B</b> y elige cualquier cosa. Pulsa <b>R</b> para girar la copia antes de colocarla. Pulsa <b>clic derecho</b> para cancelar.',
  s23_t: 'Acércalo o aléjalo', s23_b: 'Pulsa <b>B</b> y elige cualquier cosa. Verás una copia en tu cursor. Gira la rueda del ratón o pulsa <b>C</b> y <b>V</b>. La copia se acerca y se aleja.',
  s24_t: 'Abre el armario', s24_b: 'Mira el armario de agujas y pulsa <b>E</b>. Cada tipo de aguja tiene su propio cajón.',
  s25_t: 'Vende más caro', s25_b: 'El cartel de la entrada dice cuánto vale una paja. Pulsa <b>Tab</b> y mira <b>VENTA</b>. Cada nivel hace que todo se venda un 5% más caro.',
  s26_t: 'Desmonta algo', s26_b: 'Apunta a algo que hayas construido. Mantén <b>X</b> hasta que se desmonte. Te devuelven todo el dinero.',
  s27_t: 'Construye un rastrillo de pistón', s27_b: 'Pulsa <b>Tab</b>. Compra la carta del Rastrillo de pistón por $60. Pulsa <b>B</b> y colócalo delante del pajar. Construirlo cuesta $120. Tiene que mirar a la paja o no hará nada. No funcionará hasta que tenga energía.',
  s28_t: 'Dale energía al rastrillo', s28_b: 'Tu rastrillo necesita energía. Pulsa <b>Tab</b> y compra Electricidad por $90. Pulsa <b>B</b> y construye un Generador de paja por $150 y un Poste eléctrico por $45. El poste debe estar a menos de 6 metros del rastrillo y del generador. Echa paja al generador para que tenga algo que quemar.',
  s29_t: 'Elige hasta dónde lanza el rastrillo', s29_b: 'Tu rastrillo lanza la paja por detrás. Tú eliges a qué distancia. Mira el rastrillo y pulsa <b>E</b> para abrir su panel. Mueve el deslizador. Las marcas del suelo muestran dónde caerá la paja.',
  s30_t: 'Alimenta una cinta con el rastrillo', s30_b: 'Pon una cinta donde cae la paja del rastrillo. Ahora el rastrillo carga la cinta solo y puedes dejar de cavar.',
  s31_t: 'Construye un brazo robótico', s31_b: 'Pulsa <b>Tab</b>. Compra los Planos de brazo pequeño por $90. Pulsa <b>B</b> y coloca el brazo entre el pajar y una cinta, $180, con un poste cerca. Cava y pone la paja en la cinta.',
  s32_t: 'Compra el detector de metales', s32_b: 'Pulsa <b>Tab</b> y compra la carta del Detector de metales por $130. Luego compra el detector en la tienda por $260. Pita más rápido cuanto más cerca estás de una aguja. Pasea por el pajar y escucha.',
  s33_t: 'Enciende y apaga el detector', s33_b: 'Coge el detector. Pulsa <b>clic derecho</b> para encenderlo y otra vez para apagarlo. Hazlo tres veces.',
  s34_t: 'Fija el pedido de entrega', s34_b: 'El tablón junto a la puerta del muelle tiene un pedido. Mira la hoja grande de la izquierda y pulsa <b>E</b>. Aparece en la esquina de tu pantalla.',
  s35_t: 'Completa el primer pedido', s35_b: 'El pedido quiere dos mil pajas pasadas por el puesto. Mantén las cintas ocupadas. El camión paga un bonus cuando se llena.',
  s36_t: 'Pon un escáner en una cinta', s36_b: 'Pulsa <b>Tab</b> y compra los Planos del Escáner MK1. Pulsa <b>B</b> y constrúyelo sobre una cinta. Revisa la paja que pasa buscando agujas.',
  s37_t: 'Mantén el fuego', s37_b: 'Mira el Generador de paja con paja en las manos y pulsa <b>E</b> para alimentarlo. Sin paja no hay energía. Hazlo dos veces.',
  s38_t: 'Compra las botas de patio', s38_b: 'Pulsa <b>Tab</b>. En <b>FORMA FÍSICA</b> compra las Botas de patio. Te hacen andar y correr más rápido.',
  s39_t: 'Estira las piernas', s39_b: 'Mantén <b>Shift</b> para correr con las manos vacías. La barra de abajo a la izquierda es tu aguante. Corre tres segundos.',
  s40_t: 'Encuentra la aguja', s40_b: 'Rodea el pajar con el detector encendido. Cuando los pitidos se vuelvan un chillido, pulsa <b>clic izquierdo</b> para cavar. O deja que el escáner la pille en la cinta.',
  s41_t: 'Llena el armario', s41_b: 'Hay más agujas en el pajar, y de más tipos. Sigue cavando, mantén las cintas en marcha y llena todos los cajones.',

  g_title: 'FIND THE NEEDLE', g_demo: 'DEMO', g_play: 'JOGAR', g_continue: 'CONTINUAR', g_newrun: 'COMEÇAR NOVA PARTIDA', g_language: 'IDIOMA', g_back: 'VOLTAR', g_settings: 'OPÇÕES',
  g_intro: 'Você tem uma pá e um palheiro com uns treze milhões de palhas. Em algum lugar lá dentro há uma agulha. Cave à mão, venda a palha na esteira e gaste o dinheiro em esteiras e máquinas até não precisar mais cavar.',
  g_ctl_desk: 'WASD mover · Mouse olhar · Botão esq cavar · Botão dir despejar · E usar · F atirar · Q largar ferramenta · Tab árvore · B construir · Shift correr · Esc menu',
  g_ctl_touch: 'Analógico esquerdo para mover · arraste à direita para olhar · BOTÃO ESQ cavar · BOTÃO DIR despejar · E usar · TAB árvore · ☰ menu',
  g_howmuch: 'QUANTA PALHA', g_small: 'PEQUENO', g_small_d: 'Feito para computadores mais fracos. Uma busca mais curta com espaço para contornar o palheiro · 5 m de altura, cerca de 4,6 milhões de palhas.',
  g_standard: 'PADRÃO', g_standard_d: 'O pátio como ele vem. O palheiro para o qual o jogo foi feito, sob um teto de aço · 7 m de altura, cerca de 13,8 milhões de palhas.',
  g_bigger: 'QUERO MAIOR', g_bigger_d: 'Palheiros maiores que este. Exigem muito do computador · 9 m de altura, cerca de 29 milhões de palhas.',
  g_newrun_warn: 'Isto recomeça do zero. Seu dinheiro, ferramentas e máquinas são apagados.', g_loading: 'MOLDANDO O PALHEIRO', g_load_tip: 'As Botas de pátio fazem você andar e correr mais rápido.',
  pause_title: 'PAUSA', resume: 'CONTINUAR', sens: 'Sensibilidade da câmera', quality: 'Gráficos', q_low: 'BAIXOS', q_high: 'ALTOS', to_title: 'SAIR PARA O MENU',
  key_wheel: 'Roda p/ cima',
  s1_t: 'Pegue um pouco de palha', s1_b: 'Olhe para o palheiro. Segure o <b>botão esquerdo</b> para puxar palha. Sua mão pega só uma palha por vez. Uma pá pega muito mais.',
  s2_t: 'Leve até o posto', s2_b: 'Siga a esteira até a placa <b>HAY IN</b> no canto do fundo. A ponta baixa da esteira é a entrada aberta.',
  s3_t: 'Venda palha no posto', s3_b: 'O posto de venda fica no canto do fundo. Vá até lá. Fique na entrada aberta e aperte o <b>botão esquerdo</b> para despejar a palha. Você recebe dinheiro por ela.',
  s4_t: 'Abra a árvore tecnológica', s4_b: 'Aperte <b>Tab</b> para abrir a árvore tecnológica. Compre máquinas e melhorias aqui. Aperte <b>Tab</b> de novo para fechar.',
  s5_t: 'Compre mãos maiores', s5_b: 'Em <b>TRABALHO MANUAL</b>, compre Mãos maiores por $0,10. Sua mão segura uma palha a mais por nível.',
  s6_t: 'Compre a pá de brinquedo', s6_b: 'Vá ao balcão da <b>SUPPLY CO.</b> e aperte <b>E</b>. Compre a Pá de brinquedo por $0,25. Ela vai para o próximo espaço livre da barra.',
  s7_t: 'Segure a pá', s7_b: 'Aperte <b>2</b> ou toque no espaço dela na barra para segurar a pá.',
  s8_t: 'Cave com a pá', s8_b: 'Olhe para o palheiro e aperte o <b>botão esquerdo</b>. A pá se enche de palha. Cave três vezes.',
  s9_t: 'Venda uma pá cheia', s9_b: 'Leve a pá até a entrada aberta e aperte o <b>botão esquerdo</b> para despejar. Veja subir pela esteira.',
  s10_t: 'Atire', s10_b: 'Com palha na pá, aperte <b>F</b> para atirar a carga inteira. Tente acertar a esteira.',
  s11_t: 'Esvazie a pá', s11_b: 'Mire onde você quer a palha. Aperte o <b>botão direito</b>. A carga inteira vai para lá. Faça isso três vezes.',
  s12_t: 'Ganhe trinta dólares', s12_b: 'Aperte o <b>botão esquerdo</b> para cavar. Leve a palha ao posto sem <b>Shift</b>, senão ela cai. Aperte o <b>botão direito</b> para despejar. Repita até ter trinta dólares. A pá custa $15 a carta e $12 a pá.',
  s13_t: 'Compre a pá', s13_b: 'Aperte <b>Tab</b>. Compre a carta da Pá por $15. Depois compre a pá na loja por $12. Aperte <b>E</b> para pegar. Ela vai para o próximo espaço livre da barra.',
  s14_t: 'Largue uma ferramenta', s14_b: 'Segure uma ferramenta. Aperte <b>Q</b> para largá-la no chão ou <b>F</b> para atirá-la. Ela fica lá. Vá até ela e aperte <b>E</b> para pegar de novo.',
  s15_t: 'Recupere uma ferramenta perdida', s15_b: 'Aperte <b>Q</b> para largar uma ferramenta. Vá ao balcão da loja e aperte <b>E</b>. Clique em <b>TRAZER ATÉ MIM</b> ao lado dela. Ela volta aos seus pés.',
  s16_t: 'Compre os planos de esteira', s16_b: 'Aperte <b>Tab</b>. Em <b>LINHAS DE PALHA</b> compre os Planos de esteira por $40. Esteiras carregam a palha por você.',
  s17_t: 'Construa uma esteira', s17_b: 'Aperte <b>B</b> e escolha Esteira transportadora, $8 por metro. Clique para iniciar o trecho e de novo para colocá-lo. Termine sobre a esteira do posto para juntar.',
  s18_t: 'Despeje palha na sua esteira', s18_b: 'Fique ao lado da sua esteira e aperte o <b>botão direito</b> para despejar uma carga. Ela vai até o posto e vende sozinha.',
  s19_t: 'Chegue a cem dólares', s19_b: 'Continue vendendo palha até ter cem dólares. Aí você pode construir máquinas em vez de carregar palha.',
  s20_t: 'Acelere as esteiras', s20_b: 'As esteiras travam se você puser demais. Aperte <b>Tab</b> e compre o <b>Motor de esteira mais rápido</b> por $15. Todas ficam mais rápidas.',
  s21_t: 'Construa o armário de agulhas', s21_b: 'Aperte <b>Tab</b>. Compre a carta do Armário de agulhas por $10. Aperte <b>B</b> e escolha o armário. Clique no chão para construir.',
  s22_t: 'Gire', s22_b: 'Aperte <b>B</b> e escolha qualquer coisa. Aperte <b>R</b> para girar a cópia antes de colocar. Botão direito cancela.',
  s23_t: 'Aproxime ou afaste', s23_b: 'Aperte <b>B</b> e escolha qualquer coisa. Você vê uma cópia no cursor. Gire a roda do mouse ou aperte <b>C</b> e <b>V</b>. A cópia se aproxima e se afasta.',
  s24_t: 'Abra o armário', s24_b: 'Olhe para o armário de agulhas e aperte <b>E</b>. Cada tipo de agulha tem sua gaveta.',
  s25_t: 'Venda mais caro', s25_b: 'A placa da entrada diz quanto vale uma palha. Aperte <b>Tab</b> e veja <b>VENDA</b>. Cada nível faz tudo vender 5% mais caro.',
  s26_t: 'Desmonte algo', s26_b: 'Mire em algo que você construiu. Segure <b>X</b> até desmontar. Você recebe todo o dinheiro de volta.',
  s27_t: 'Construa um ancinho de pistão', s27_b: 'Aperte <b>Tab</b>. Compre a carta do Ancinho de pistão por $60. Aperte <b>B</b> e coloque-o em frente ao palheiro. Custa $120. Ele precisa estar virado para a palha ou não faz nada. Só funciona com energia.',
  s28_t: 'Dê energia ao ancinho', s28_b: 'Seu ancinho precisa de energia. Aperte <b>Tab</b> e compre Eletricidade por $90. Aperte <b>B</b> e construa um Gerador de palha por $150 e um Poste elétrico por $45. O poste deve ficar a até 6 metros do ancinho e do gerador. Ponha palha no gerador para ele ter o que queimar.',
  s29_t: 'Ajuste até onde o ancinho atira', s29_b: 'Seu ancinho atira a palha para trás. Você escolhe a distância. Olhe para o ancinho e aperte <b>E</b> para abrir o painel. Arraste o controle. As marcas no chão mostram onde a palha cai.',
  s30_t: 'Alimente uma esteira com o ancinho', s30_b: 'Coloque uma esteira onde cai a palha do ancinho. Agora ele carrega a esteira sozinho e você pode parar de cavar.',
  s31_t: 'Construa um braço robótico', s31_b: 'Aperte <b>Tab</b>. Compre os Planos de braço pequeno por $90. Aperte <b>B</b> e coloque o braço entre o palheiro e uma esteira, $180, com um poste perto. Ele cava e põe a palha na esteira.',
  s32_t: 'Compre o detector de metais', s32_b: 'Aperte <b>Tab</b> e compre a carta do Detector de metais por $130. Depois compre o detector na loja por $260. Ele apita mais rápido perto de uma agulha. Ande sobre o palheiro e escute.',
  s33_t: 'Ligue e desligue o detector', s33_b: 'Segure o detector. Aperte o <b>botão direito</b> para ligar e de novo para desligar. Faça isso três vezes.',
  s34_t: 'Fixe o pedido de entrega', s34_b: 'O quadro perto da porta da doca tem um pedido. Olhe a folha grande à esquerda e aperte <b>E</b>. Ele aparece no canto da tela.',
  s35_t: 'Complete o primeiro pedido', s35_b: 'O pedido quer duas mil palhas vendidas no posto. Mantenha as esteiras ocupadas. O caminhão paga um bônus quando enche.',
  s36_t: 'Ponha um scanner numa esteira', s36_b: 'Aperte <b>Tab</b> e compre os Planos do Scanner MK1. Aperte <b>B</b> e construa-o sobre uma esteira. Ele verifica a palha que passa em busca de agulhas.',
  s37_t: 'Mantenha o fogo aceso', s37_b: 'Olhe para o Gerador de palha com palha nas mãos e aperte <b>E</b> para alimentá-lo. Sem palha, sem energia. Faça isso duas vezes.',
  s38_t: 'Compre as botas de pátio', s38_b: 'Aperte <b>Tab</b>. Em <b>FORMA FÍSICA</b> compre as Botas de pátio. Você anda e corre mais rápido.',
  s39_t: 'Estique as pernas', s39_b: 'Segure <b>Shift</b> para correr de mãos vazias. A barra no canto inferior esquerdo é seu fôlego. Corra por três segundos.',
  s40_t: 'Encontre a agulha', s40_b: 'Contorne o palheiro com o detector ligado. Quando os bipes virarem um grito, aperte o <b>botão esquerdo</b> para cavar. Ou deixe o scanner pegá-la na esteira.',
  s41_t: 'Encha o armário', s41_b: 'Há mais agulhas no palheiro, e de mais tipos. Continue cavando, mantenha as esteiras rodando e encha todas as gavetas.',

  g_intro: "Tu as une pelle et une meule d'environ treize millions de brins. Quelque part dedans, il y a une aiguille. Creuse à la main, vends le foin sur le tapis, puis dépense l'argent en tapis et machines jusqu'à ne plus avoir à creuser.",
  g_ctl_desk: 'ZQSD/WASD bouger · Souris regarder · Clic G creuser · Clic D vider · E utiliser · F lancer · Q poser l’outil · Tab arbre · B construire · Shift courir · Échap menu',
  g_ctl_touch: 'Stick gauche pour bouger · glisse à droite pour regarder · CLIC G creuser · CLIC D vider · E utiliser · TAB arbre · ☰ menu',
  g_howmuch: 'COMBIEN DE FOIN', g_small: 'PETIT', g_small_d: 'Pour les ordinateurs modestes. Une chasse plus courte avec de la place autour de la meule · 5 m de haut, environ 4,6 millions de brins.',
  g_standard: 'STANDARD', g_standard_d: "La cour telle quelle. La meule autour de laquelle le jeu a été fait, sous un toit d'acier · 7 m de haut, environ 13,8 millions de brins.",
  g_bigger: 'JE LE VEUX PLUS GROS', g_bigger_d: 'Des meules plus grosses que celle-ci. Elles demandent beaucoup à un ordinateur · 9 m de haut, environ 29 millions de brins.',
  g_newrun_warn: 'Cela recommence à zéro. Ton argent, tes outils et tes machines sont effacés.', g_loading: 'MISE EN FORME DE LA MEULE', g_load_tip: 'Les Bottes de cour te font marcher et courir plus vite.',
  pause_title: 'PAUSE', resume: 'REPRENDRE', sens: 'Sensibilité de la vue', quality: 'Graphismes', q_low: 'BAS', q_high: 'HAUTS', to_title: 'QUITTER AU TITRE',
  key_wheel: 'Molette haut',
  s1_t: 'Ramasse un peu de foin', s1_b: 'Regarde la meule. Maintiens le <b>clic gauche</b> pour arracher du foin. Ta main ne prend qu’un brin à la fois. Une pelle en prend bien plus.',
  s2_t: "Porte-le jusqu'au stand", s2_b: "Suis le tapis jusqu'au panneau <b>HAY IN</b> dans le coin du fond. Le bas du tapis est la baie ouverte.",
  s3_t: 'Vends du foin au stand', s3_b: 'Le stand de vente est dans le coin du fond. Va là-bas. Place-toi à la baie ouverte et fais <b>clic gauche</b> pour verser le foin. On te paie.',
  s4_t: "Ouvre l'arbre technologique", s4_b: "Appuie sur <b>Tab</b> pour ouvrir l'arbre technologique. On y achète machines et améliorations. Appuie encore sur <b>Tab</b> pour le fermer.",
  s5_t: 'Achète des mains plus grandes', s5_b: 'Dans <b>TRAVAIL MANUEL</b>, achète Mains plus grandes pour 0,10 $. Ta main tient un brin de plus par niveau.',
  s6_t: 'Achète la pelle jouet', s6_b: 'Va au comptoir <b>SUPPLY CO.</b> et appuie sur <b>E</b>. Achète la Pelle jouet pour 0,25 $. Elle va dans la prochaine case libre de ta barre.',
  s7_t: 'Prends la pelle', s7_b: 'Appuie sur <b>2</b> ou touche sa case dans la barre pour prendre la pelle en main.',
  s8_t: 'Creuse avec la pelle', s8_b: 'Regarde la meule et fais <b>clic gauche</b>. La pelle se remplit de foin. Creuse trois fois.',
  s9_t: 'Vends une pelle pleine', s9_b: 'Porte la pelle à la baie ouverte et fais <b>clic gauche</b> pour la verser. Regarde-la monter sur le tapis.',
  s10_t: 'Lance-le', s10_b: 'Avec du foin sur la pelle, appuie sur <b>F</b> pour lancer toute la charge. Essaie de viser le tapis.',
  s11_t: 'Vide la pelle', s11_b: 'Vise là où tu veux le foin. Fais <b>clic droit</b>. Toute la charge part là. Fais-le trois fois.',
  s12_t: 'Gagne trente dollars', s12_b: 'Fais <b>clic gauche</b> pour creuser. Porte le foin au stand sans <b>Shift</b>, sinon tu le lâches. Fais <b>clic droit</b> pour le verser. Continue jusqu’à trente dollars. La bêche coûte 15 $ la carte et 12 $ la bêche.',
  s13_t: 'Achète la bêche', s13_b: 'Appuie sur <b>Tab</b>. Achète la carte Bêche pour 15 $. Puis achète la bêche à la boutique pour 12 $. Appuie sur <b>E</b> pour la prendre. Elle va dans la prochaine case libre.',
  s14_t: 'Pose un outil', s14_b: 'Prends un outil en main. Appuie sur <b>Q</b> pour le poser par terre, ou <b>F</b> pour le lancer. Il reste là. Va vers lui et appuie sur <b>E</b> pour le reprendre.',
  s15_t: 'Récupère un outil perdu', s15_b: 'Appuie sur <b>Q</b> pour poser un outil. Va au comptoir de la boutique et appuie sur <b>E</b>. Clique sur <b>RAMÈNE-LE</b> à côté de cet outil. Il revient à tes pieds.',
  s16_t: 'Achète les plans de tapis', s16_b: 'Appuie sur <b>Tab</b>. Dans <b>LIGNES DE FOIN</b>, achète les Plans de tapis pour 40 $. Les tapis portent le foin pour toi.',
  s17_t: 'Construis un tapis roulant', s17_b: 'Appuie sur <b>B</b> et choisis Tapis roulant, 8 $ le mètre. Clique pour commencer le tronçon, puis encore pour le poser. Termine-le sur le tapis du stand pour les relier.',
  s18_t: 'Verse du foin sur ton tapis', s18_b: 'Place-toi près de ton tapis et fais <b>clic droit</b> pour y verser une charge. Elle va au stand et se vend toute seule.',
  s19_t: 'Atteins cent dollars', s19_b: "Continue à vendre du foin jusqu'à avoir cent dollars. Ensuite tu pourras construire des machines au lieu de porter le foin toi-même.",
  s20_t: 'Accélère les tapis', s20_b: 'Les tapis se bouchent si tu en mets trop. Appuie sur <b>Tab</b> et achète le <b>Moteur de tapis plus rapide</b> pour 15 $. Tous les tapis vont plus vite.',
  s21_t: "Construis l'armoire à aiguilles", s21_b: "Appuie sur <b>Tab</b>. Achète la carte Armoire à aiguilles pour 10 $. Appuie sur <b>B</b> et choisis l'armoire. Clique au sol pour la construire.",
  s22_t: 'Fais-la tourner', s22_b: "Appuie sur <b>B</b> et choisis n'importe quoi. Appuie sur <b>R</b> pour tourner la copie avant de la poser. <b>Clic droit</b> pour annuler.",
  s23_t: 'Rapproche-la ou éloigne-la', s23_b: "Appuie sur <b>B</b> et choisis n'importe quoi. Tu vois une copie sur ton curseur. Tourne la molette ou appuie sur <b>C</b> et <b>V</b>. La copie se rapproche et s'éloigne.",
  s24_t: "Ouvre l'armoire", s24_b: "Regarde l'armoire à aiguilles et appuie sur <b>E</b>. Chaque sorte d'aiguille a son tiroir.",
  s25_t: 'Vends plus cher', s25_b: 'Le panneau de la baie indique ce que vaut un brin. Appuie sur <b>Tab</b> et regarde <b>VENTE</b>. Chaque niveau fait tout vendre 5 % plus cher.',
  s26_t: 'Démonte quelque chose', s26_b: "Vise quelque chose que tu as construit. Maintiens <b>X</b> jusqu'à ce qu'il tombe. On te rend tout l'argent.",
  s27_t: 'Construis un râteau à piston', s27_b: "Appuie sur <b>Tab</b>. Achète la carte Râteau à piston pour 60 $. Appuie sur <b>B</b> et pose-le devant la meule. Il coûte 120 $. Il doit faire face au foin, sinon il ne fait rien. Il ne marche pas sans énergie.",
  s28_t: "Donne de l'énergie au râteau", s28_b: "Ton râteau a besoin d'énergie. Appuie sur <b>Tab</b> et achète Électricité pour 90 $. Appuie sur <b>B</b> et construis un Générateur à foin pour 150 $ et un Poteau électrique pour 45 $. Le poteau doit être à moins de 6 mètres du râteau et du générateur. Mets du foin dans le générateur pour qu'il ait de quoi brûler.",
  s29_t: 'Règle la portée du râteau', s29_b: 'Ton râteau lance le foin par-dessus son dos. Tu choisis la distance. Regarde le râteau et appuie sur <b>E</b> pour ouvrir son panneau. Déplace le curseur. Les marques au sol montrent où le foin tombera.',
  s30_t: 'Alimente un tapis avec le râteau', s30_b: 'Pose un tapis là où tombe le foin du râteau. Le râteau charge alors le tapis tout seul et tu peux arrêter de creuser.',
  s31_t: 'Construis un bras robotique', s31_b: 'Appuie sur <b>Tab</b>. Achète les Plans de petit bras pour 90 $. Appuie sur <b>B</b> et pose le bras entre la meule et un tapis, 180 $, avec un poteau à côté. Il creuse et pose le foin sur le tapis.',
  s32_t: 'Achète le détecteur de métaux', s32_b: "Appuie sur <b>Tab</b> et achète la carte Détecteur de métaux pour 130 $. Puis achète le détecteur à la boutique pour 260 $. Il bipe plus vite près d'une aiguille. Marche autour de la meule et écoute.",
  s33_t: 'Allume et éteins le détecteur', s33_b: "Prends le détecteur. Fais <b>clic droit</b> pour l'allumer, puis encore pour l'éteindre. Fais-le trois fois.",
  s34_t: 'Épingle le bon de livraison', s34_b: "Le tableau près de la porte du quai porte une commande. Regarde la grande feuille à gauche et appuie sur <b>E</b>. Elle s'affiche dans le coin de ton écran.",
  s35_t: 'Remplis la première commande', s35_b: 'La commande veut deux mille brins passés par le stand. Garde les tapis occupés. Le camion paie un bonus quand il est plein.',
  s36_t: 'Mets un scanner sur un tapis', s36_b: "Appuie sur <b>Tab</b> et achète les Plans du Scanner MK1. Appuie sur <b>B</b> et construis-le sur un tapis. Il vérifie le foin qui passe à la recherche d'aiguilles.",
  s37_t: 'Entretiens le feu', s37_b: "Regarde le Générateur à foin avec du foin en main et appuie sur <b>E</b> pour l'alimenter. Pas de foin, pas d'énergie. Fais-le deux fois.",
  s38_t: 'Achète les bottes de cour', s38_b: 'Appuie sur <b>Tab</b>. Dans <b>FORME</b>, achète les Bottes de cour. Tu marches et cours plus vite.',
  s39_t: 'Dégourdis-toi les jambes', s39_b: 'Maintiens <b>Shift</b> pour courir les mains vides. La barre en bas à gauche est ton endurance. Cours trois secondes.',
  s40_t: "Trouve l'aiguille", s40_b: 'Fais le tour de la meule avec le détecteur allumé. Quand les bips deviennent un cri, fais <b>clic gauche</b> pour creuser. Ou laisse le scanner l’attraper sur le tapis.',
  s41_t: "Remplis l'armoire", s41_b: "Il y a d'autres aiguilles dans la meule, et d'autres sortes. Continue à creuser, fais tourner les tapis et remplis chaque tiroir.",

  g_intro: 'Du hast eine Schaufel und einen Heuhaufen mit etwa dreizehn Millionen Halmen. Irgendwo darin steckt eine Nadel. Grab von Hand, verkauf das Heu am Band und investiere das Geld in Bänder und Maschinen, bis du nicht mehr selbst graben musst.',
  g_ctl_desk: 'WASD bewegen · Maus schauen · LMT graben · RMT kippen · E nutzen · F werfen · Q Werkzeug ablegen · Tab Baum · B bauen · Shift rennen · Esc Menü',
  g_ctl_touch: 'Linker Stick bewegen · rechts wischen zum Schauen · LMT graben · RMT kippen · E nutzen · TAB Baum · ☰ Menü',
  g_howmuch: 'WIE VIEL HEU', g_small: 'KLEIN', g_small_d: 'Für schwächere Computer. Eine kürzere Suche mit Platz um den Haufen · 5 m hoch, etwa 4,6 Millionen Halme.',
  g_standard: 'STANDARD', g_standard_d: 'Der Hof, wie er ist. Der Haufen, um den das Spiel gebaut wurde, unter einem Stahldach · 7 m hoch, etwa 13,8 Millionen Halme.',
  g_bigger: 'ICH WILL GRÖSSER', g_bigger_d: 'Größere Haufen als dieser. Sie verlangen einem Computer viel ab · 9 m hoch, etwa 29 Millionen Halme.',
  g_newrun_warn: 'Das fängt von vorne an. Dein Geld, deine Werkzeuge und Maschinen werden gelöscht.', g_loading: 'DER HAUFEN WIRD GEFORMT', g_load_tip: 'Hofstiefel lassen dich schneller gehen und rennen.',
  pause_title: 'PAUSE', resume: 'FORTSETZEN', sens: 'Maus-Empfindlichkeit', quality: 'Grafik', q_low: 'NIEDRIG', q_high: 'HOCH', to_title: 'ZUM TITEL',
  key_wheel: 'Mausrad hoch',
  s1_t: 'Heb etwas Heu auf', s1_b: 'Schau auf den Heuhaufen. Halte die <b>linke Maustaste</b>, um Heu herauszuziehen. Deine Hand nimmt nur einen Halm auf einmal. Eine Schaufel nimmt viel mehr.',
  s2_t: 'Trag es zum Stand', s2_b: 'Folge dem Band zum <b>HAY IN</b>-Schild in der hinteren Ecke. Das untere Ende des Bandes ist die offene Bucht.',
  s3_t: 'Verkauf Heu am Stand', s3_b: 'Der Verkaufsstand ist in der hinteren Ecke. Geh hin. Stell dich an die offene Bucht und klick <b>links</b>, um das Heu einzuwerfen. Du wirst bezahlt.',
  s4_t: 'Öffne den Technologiebaum', s4_b: 'Drück <b>Tab</b>, um den Technologiebaum zu öffnen. Dort kaufst du Maschinen und Upgrades. Drück erneut <b>Tab</b>, um ihn zu schließen.',
  s5_t: 'Kauf größere Hände', s5_b: 'Kauf unter <b>HANDARBEIT</b> Größere Hände für 0,10 $. Deine Hand hält pro Stufe einen Halm mehr.',
  s6_t: 'Kauf die Spielzeugschaufel', s6_b: 'Geh zur Theke von <b>SUPPLY CO.</b> und drück <b>E</b>. Kauf die Spielzeugschaufel für 0,25 $. Sie kommt in den nächsten freien Platz deiner Leiste.',
  s7_t: 'Nimm die Schaufel', s7_b: 'Drück <b>2</b> oder tippe auf ihren Platz in der Leiste, um die Schaufel in die Hand zu nehmen.',
  s8_t: 'Grab mit der Schaufel', s8_b: 'Schau auf den Heuhaufen und klick <b>links</b>. Die Schaufel füllt sich mit Heu. Grab dreimal.',
  s9_t: 'Verkauf eine volle Schaufel', s9_b: 'Trag die Schaufel zur offenen Bucht und klick <b>links</b>, um sie einzuwerfen. Sieh zu, wie sie das Band hochfährt.',
  s10_t: 'Wirf es', s10_b: 'Mit Heu auf der Schaufel drück <b>F</b>, um die ganze Ladung zu werfen. Versuch, das Band zu treffen.',
  s11_t: 'Kipp die Schaufel aus', s11_b: 'Ziel dorthin, wo das Heu hin soll. Klick <b>rechts</b>. Die ganze Ladung landet dort. Mach das dreimal.',
  s12_t: 'Verdien dreißig Dollar', s12_b: 'Klick <b>links</b> zum Graben. Trag das Heu ohne <b>Shift</b> zum Stand, sonst verlierst du es. Klick <b>rechts</b> zum Einwerfen. Weiter bis dreißig Dollar. Der Spaten kostet 15 $ für die Karte und 12 $ für den Spaten.',
  s13_t: 'Kauf den Spaten', s13_b: 'Drück <b>Tab</b>. Kauf die Spaten-Karte für 15 $. Dann kauf den Spaten im Laden für 12 $. Drück <b>E</b>, um ihn aufzuheben. Er kommt in den nächsten freien Platz.',
  s14_t: 'Leg ein Werkzeug ab', s14_b: 'Nimm ein Werkzeug in die Hand. Drück <b>Q</b>, um es abzulegen, oder <b>F</b>, um es zu werfen. Es bleibt liegen. Geh hin und drück <b>E</b>, um es wieder aufzuheben.',
  s15_t: 'Hol ein verlorenes Werkzeug', s15_b: 'Drück <b>Q</b>, um ein Werkzeug abzulegen. Geh zur Ladentheke und drück <b>E</b>. Klick bei diesem Werkzeug auf <b>HERBRINGEN</b>. Es kommt zu deinen Füßen zurück.',
  s16_t: 'Kauf die Förderband-Pläne', s16_b: 'Drück <b>Tab</b>. Kauf unter <b>HEULINIEN</b> die Förderband-Pläne für 40 $. Bänder tragen das Heu für dich.',
  s17_t: 'Bau ein Förderband', s17_b: 'Drück <b>B</b> und wähl Förderband, 8 $ pro Meter. Klick, um die Strecke zu beginnen, und nochmal, um sie zu setzen. Lass sie am Band des Stands enden, um sie zu verbinden.',
  s18_t: 'Kipp Heu auf dein Band', s18_b: 'Stell dich neben dein Band und klick <b>rechts</b>, um eine Ladung darauf zu kippen. Sie fährt zum Stand und verkauft sich von selbst.',
  s19_t: 'Erreich hundert Dollar', s19_b: 'Verkauf weiter Heu, bis du hundert Dollar hast. Dann kannst du Maschinen bauen, statt das Heu selbst zu tragen.',
  s20_t: 'Mach die Bänder schneller', s20_b: 'Bänder verstopfen, wenn du zu viel auflegst. Drück <b>Tab</b> und kauf den <b>Schnelleren Bandmotor</b> für 15 $. Alle Bänder laufen schneller.',
  s21_t: 'Bau den Nadelschrank', s21_b: 'Drück <b>Tab</b>. Kauf die Nadelschrank-Karte für 10 $. Drück <b>B</b> und wähl den Schrank. Klick auf den Boden, um ihn zu bauen.',
  s22_t: 'Dreh ihn um', s22_b: 'Drück <b>B</b> und wähl irgendetwas. Drück <b>R</b>, um die Vorschau vor dem Setzen zu drehen. <b>Rechtsklick</b> bricht ab.',
  s23_t: 'Näher oder weiter weg', s23_b: 'Drück <b>B</b> und wähl irgendetwas. Du siehst eine Vorschau am Cursor. Dreh das Mausrad oder drück <b>C</b> und <b>V</b>. Die Vorschau kommt näher und geht weiter weg.',
  s24_t: 'Öffne den Schrank', s24_b: 'Schau auf den Nadelschrank und drück <b>E</b>. Jede Nadelart hat ihre Schublade.',
  s25_t: 'Verkauf teurer', s25_b: 'Das Schild an der Bucht zeigt, was ein Halm wert ist. Drück <b>Tab</b> und schau unter <b>VERKAUF</b>. Jede Stufe verkauft alles 5 % teurer.',
  s26_t: 'Bau etwas wieder ab', s26_b: 'Ziel auf etwas, das du gebaut hast. Halte <b>X</b>, bis es fällt. Du bekommst das ganze Geld zurück.',
  s27_t: 'Bau einen Kolbenrechen', s27_b: 'Drück <b>Tab</b>. Kauf die Kolbenrechen-Karte für 60 $. Drück <b>B</b> und setz ihn vor den Heuhaufen. Er kostet 120 $. Er muss zum Heu zeigen, sonst tut er nichts. Ohne Strom geht er nicht.',
  s28_t: 'Gib dem Rechen Strom', s28_b: 'Dein Rechen braucht Strom. Drück <b>Tab</b> und kauf Elektrizität für 90 $. Drück <b>B</b> und bau einen Heu-Generator für 150 $ und einen Strommast für 45 $. Der Mast muss höchstens 6 Meter vom Rechen und vom Generator entfernt stehen. Leg Heu in den Generator, damit er etwas zu verbrennen hat.',
  s29_t: 'Stell die Wurfweite ein', s29_b: 'Dein Rechen wirft das Heu über seinen Rücken. Du bestimmst, wie weit. Schau auf den Rechen und drück <b>E</b>, um sein Panel zu öffnen. Schieb den Regler. Die Markierungen am Boden zeigen, wo das Heu landet.',
  s30_t: 'Füttere ein Band mit dem Rechen', s30_b: 'Leg ein Band dorthin, wo das Heu des Rechens landet. Dann belädt der Rechen das Band von selbst und du musst nicht mehr graben.',
  s31_t: 'Bau einen Roboterarm', s31_b: 'Drück <b>Tab</b>. Kauf die Pläne für kleinen Arm für 90 $. Drück <b>B</b> und setz den Arm zwischen Heuhaufen und ein Band, 180 $, mit einem Mast daneben. Er gräbt und legt das Heu aufs Band.',
  s32_t: 'Kauf den Metalldetektor', s32_b: 'Drück <b>Tab</b> und kauf die Metalldetektor-Karte für 130 $. Dann kauf den Detektor im Laden für 260 $. Er piept schneller, je näher du einer Nadel bist. Geh um den Haufen und hör hin.',
  s33_t: 'Schalte den Detektor ein und aus', s33_b: 'Nimm den Detektor. Klick <b>rechts</b>, um ihn einzuschalten, und nochmal, um ihn auszuschalten. Mach das dreimal.',
  s34_t: 'Hefte den Lieferauftrag an', s34_b: 'Die Tafel neben dem Ladetor hat einen Auftrag. Schau auf das große Blatt links und drück <b>E</b>. Er erscheint in der Ecke deines Bildschirms.',
  s35_t: 'Erfüll den ersten Auftrag', s35_b: 'Der Auftrag will zweitausend Halme durch den Stand. Halte die Bänder beschäftigt. Der Lkw zahlt einen Bonus, wenn er voll ist.',
  s36_t: 'Stell einen Scanner aufs Band', s36_b: 'Drück <b>Tab</b> und kauf die Scanner-MK1-Pläne. Drück <b>B</b> und bau ihn auf ein Band. Er prüft das vorbeifahrende Heu auf Nadeln.',
  s37_t: 'Halte das Feuer am Laufen', s37_b: 'Schau mit Heu in der Hand auf den Heu-Generator und drück <b>E</b>, um ihn zu füttern. Kein Heu, kein Strom. Mach das zweimal.',
  s38_t: 'Kauf Hofstiefel', s38_b: 'Drück <b>Tab</b>. Kauf unter <b>FITNESS</b> die Hofstiefel. Du gehst und rennst schneller.',
  s39_t: 'Vertritt dir die Beine', s39_b: 'Halte <b>Shift</b>, um mit leeren Händen zu rennen. Die Leiste unten links ist deine Ausdauer. Renne drei Sekunden.',
  s40_t: 'Finde die Nadel', s40_b: 'Geh mit eingeschaltetem Detektor um den Haufen. Wenn das Piepen zum Schrei wird, klick <b>links</b> zum Graben. Oder lass den Scanner sie auf dem Band erwischen.',
  s41_t: 'Füll den Schrank', s41_b: 'Im Haufen gibt es noch mehr Nadeln, und mehr Arten. Grab weiter, halte die Bänder am Laufen und füll jede Schublade.',

  s1_t: 'Raccogli un po’ di fieno', s1_b: 'Guarda il pagliaio. Tieni premuto il <b>tasto sinistro</b> per tirare fuori il fieno. La tua mano prende solo un filo alla volta. Una pala ne prende molti di più.',
  s2_t: 'Portalo al banco', s2_b: "Segui il nastro fino al cartello <b>HAY IN</b> nell'angolo in fondo. L'estremità bassa del nastro è la baia aperta.",
  s3_t: 'Vendi fieno al banco', s3_b: "Il banco vendita è nell'angolo in fondo. Vai lì. Mettiti alla baia aperta e fai <b>clic sinistro</b> per versare il fieno. Vieni pagato.",
  s4_t: "Apri l'albero tecnologico", s4_b: "Premi <b>Tab</b> per aprire l'albero tecnologico. Lì compri macchine e migliorie. Premi di nuovo <b>Tab</b> per chiuderlo.",
  s5_t: 'Compra mani più grandi', s5_b: 'In <b>LAVORO MANUALE</b>, compra Mani più grandi per 0,10 $. La tua mano tiene un filo in più per livello.',
  s6_t: 'Compra la paletta giocattolo', s6_b: 'Vai al bancone di <b>SUPPLY CO.</b> e premi <b>E</b>. Compra la Paletta giocattolo per 0,25 $. Va nel prossimo spazio libero della barra.',
  s7_t: 'Impugna la paletta', s7_b: 'Premi <b>2</b> o tocca il suo spazio nella barra per prendere in mano la paletta.',
  s8_t: 'Scava con la paletta', s8_b: 'Guarda il pagliaio e fai <b>clic sinistro</b>. La paletta si riempie di fieno. Scava tre volte.',
  s9_t: 'Vendi una paletta piena', s9_b: 'Porta la paletta alla baia aperta e fai <b>clic sinistro</b> per versarla. Guardala salire sul nastro.',
  s10_t: 'Lancialo', s10_b: 'Con del fieno sulla paletta, premi <b>F</b> per lanciare tutto il carico. Prova a centrare il nastro.',
  s11_t: 'Svuota la paletta', s11_b: 'Mira dove vuoi il fieno. Fai <b>clic destro</b>. Tutto il carico va lì. Fallo tre volte.',
  s12_t: 'Guadagna trenta dollari', s12_b: 'Fai <b>clic sinistro</b> per scavare. Porta il fieno al banco senza <b>Shift</b>, altrimenti lo perdi. Fai <b>clic destro</b> per versarlo. Continua fino a trenta dollari. La vanga costa 15 $ la carta e 12 $ la vanga.',
  s13_t: 'Compra la vanga', s13_b: 'Premi <b>Tab</b>. Compra la carta Vanga per 15 $. Poi compra la vanga al negozio per 12 $. Premi <b>E</b> per prenderla. Va nel prossimo spazio libero.',
  s14_t: 'Posa un attrezzo', s14_b: 'Prendi in mano un attrezzo. Premi <b>Q</b> per posarlo a terra, o <b>F</b> per lanciarlo. Resta lì. Vai da lui e premi <b>E</b> per riprenderlo.',
  s15_t: 'Recupera un attrezzo perso', s15_b: 'Premi <b>Q</b> per posare un attrezzo. Vai al bancone del negozio e premi <b>E</b>. Clicca <b>PORTAMELO</b> accanto a quell’attrezzo. Torna ai tuoi piedi.',
  s16_t: 'Compra i progetti del nastro', s16_b: 'Premi <b>Tab</b>. In <b>LINEE DEL FIENO</b>, compra i Progetti del nastro per 40 $. I nastri portano il fieno al posto tuo.',
  s17_t: 'Costruisci un nastro trasportatore', s17_b: 'Premi <b>B</b> e scegli Nastro trasportatore, 8 $ al metro. Clicca per iniziare il tratto e di nuovo per posarlo. Fallo finire sul nastro del banco per collegarli.',
  s18_t: 'Versa fieno sul tuo nastro', s18_b: 'Mettiti vicino al tuo nastro e fai <b>clic destro</b> per versarci un carico. Va al banco e si vende da solo.',
  s19_t: 'Arriva a cento dollari', s19_b: 'Continua a vendere fieno finché non hai cento dollari. Poi potrai costruire macchine invece di portare il fieno tu.',
  s20_t: 'Velocizza i nastri', s20_b: 'I nastri si intasano se ci metti troppo. Premi <b>Tab</b> e compra il <b>Motore nastro più veloce</b> per 15 $. Tutti i nastri vanno più veloci.',
  s21_t: "Costruisci l'armadietto degli aghi", s21_b: "Premi <b>Tab</b>. Compra la carta Armadietto degli aghi per 10 $. Premi <b>B</b> e scegli l'armadietto. Clicca a terra per costruirlo.",
  s22_t: 'Giralo', s22_b: "Premi <b>B</b> e scegli qualcosa. Premi <b>R</b> per ruotare l'anteprima prima di posarla. <b>Clic destro</b> per annullare.",
  s23_t: 'Avvicinalo o allontanalo', s23_b: "Premi <b>B</b> e scegli qualcosa. Vedi un'anteprima sul cursore. Gira la rotella o premi <b>C</b> e <b>V</b>. L'anteprima si avvicina e si allontana.",
  s24_t: "Apri l'armadietto", s24_b: "Guarda l'armadietto degli aghi e premi <b>E</b>. Ogni tipo di ago ha il suo cassetto.",
  s25_t: 'Vendi a più', s25_b: 'Il cartello alla baia dice quanto vale un filo. Premi <b>Tab</b> e guarda <b>VENDITA</b>. Ogni livello fa vendere tutto il 5% in più.',
  s26_t: 'Smonta qualcosa', s26_b: 'Mira a qualcosa che hai costruito. Tieni premuto <b>X</b> finché non cade. Riavrai tutti i soldi.',
  s27_t: 'Costruisci un rastrello a pistone', s27_b: 'Premi <b>Tab</b>. Compra la carta Rastrello a pistone per 60 $. Premi <b>B</b> e posalo davanti al pagliaio. Costa 120 $. Deve guardare il fieno, altrimenti non fa nulla. Senza energia non funziona.',
  s28_t: 'Dai energia al rastrello', s28_b: 'Il rastrello ha bisogno di energia. Premi <b>Tab</b> e compra Elettricità per 90 $. Premi <b>B</b> e costruisci un Generatore a fieno per 150 $ e un Palo elettrico per 45 $. Il palo deve stare entro 6 metri dal rastrello e dal generatore. Metti fieno nel generatore così ha qualcosa da bruciare.',
  s29_t: 'Regola quanto lancia il rastrello', s29_b: 'Il rastrello lancia il fieno dietro di sé. Tu decidi quanto lontano. Guarda il rastrello e premi <b>E</b> per aprire il suo pannello. Sposta il cursore. I segni a terra mostrano dove cadrà il fieno.',
  s30_t: 'Alimenta un nastro col rastrello', s30_b: 'Metti un nastro dove cade il fieno del rastrello. Così il rastrello carica il nastro da solo e puoi smettere di scavare.',
  s31_t: 'Costruisci un braccio robotico', s31_b: 'Premi <b>Tab</b>. Compra i Progetti del braccio piccolo per 90 $. Premi <b>B</b> e posa il braccio tra il pagliaio e un nastro, 180 $, con un palo vicino. Scava e mette il fieno sul nastro.',
  s32_t: 'Compra il metal detector', s32_b: 'Premi <b>Tab</b> e compra la carta Metal detector per 130 $. Poi compra il detector al negozio per 260 $. Suona più veloce vicino a un ago. Gira intorno al pagliaio e ascolta.',
  s33_t: 'Accendi e spegni il detector', s33_b: 'Impugna il detector. Fai <b>clic destro</b> per accenderlo, poi di nuovo per spegnerlo. Fallo tre volte.',
  s34_t: "Appendi l'ordine di consegna", s34_b: "La lavagna vicino alla porta della baia ha un ordine. Guarda il foglio grande a sinistra e premi <b>E</b>. Appare nell'angolo dello schermo.",
  s35_t: 'Completa il primo ordine', s35_b: "L'ordine vuole duemila fili passati dal banco. Tieni occupati i nastri. Il camion paga un bonus quando è pieno.",
  s36_t: 'Metti uno scanner su un nastro', s36_b: 'Premi <b>Tab</b> e compra i Progetti Scanner MK1. Premi <b>B</b> e costruiscilo su un nastro. Controlla il fieno che passa in cerca di aghi.',
  s37_t: 'Tieni vivo il fuoco', s37_b: 'Guarda il Generatore a fieno con del fieno in mano e premi <b>E</b> per alimentarlo. Niente fieno, niente energia. Fallo due volte.',
  s38_t: 'Compra gli stivali da cortile', s38_b: 'Premi <b>Tab</b>. In <b>FORMA FISICA</b>, compra gli Stivali da cortile. Cammini e corri più veloce.',
  s39_t: 'Sgranchisciti le gambe', s39_b: 'Tieni premuto <b>Shift</b> per correre a mani vuote. La barra in basso a sinistra è la tua resistenza. Corri per tre secondi.',
  s40_t: "Trova l'ago", s40_b: 'Gira intorno al pagliaio con il detector acceso. Quando i bip diventano un urlo, fai <b>clic sinistro</b> per scavare. Oppure lascia che lo scanner lo prenda sul nastro.',
  s41_t: "Riempi l'armadietto", s41_b: 'Nel pagliaio ci sono altri aghi, e di altri tipi. Continua a scavare, fai girare i nastri e riempi ogni cassetto.',

  box.querySelector('.cl-copy').onclick = async e => {

    try { await navigator.clipboard.writeText(cloud.code); } catch (_) { const r = document.createRange(); r.selectNodeContents(box.querySelector('.cl-c')); getSelection().removeAllRanges(); getSelection().addRange(r); try { document.execCommand('copy'); } catch (_) {} }
    msg.className = 'cl-msg ok'; msg.textContent = t('cloud_copied'); setTimeout(() => { if (msg.textContent === t('cloud_copied')) msg.textContent = ''; }, 1800);
  };
});
